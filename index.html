<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吃了么 - 极客减脂与心理保护系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8">
    <div class="max-w-2xl mx-auto space-y-6">
        <!-- 头部 -->
        <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-3xl font-bold tracking-tight text-white">吃了么.</h1>
                    <span id="apiStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-rose-950 text-rose-400 border border-rose-800/50 flex items-center gap-1 cursor-pointer" onclick="openKeyModal()">
                        <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span> 未连接 API
                    </span>
                </div>
                <p class="text-zinc-400 text-xs mt-1">动态减脂与心理保护系统 V2.0</p>
            </div>
            <div class="flex gap-2">
                <button onclick="openKeyModal()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 transition">
                    🔑 设置 Key
                </button>
                <button onclick="openSurveyModal()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-lg border border-zinc-700 transition">
                    📋 评估问卷
                </button>
            </div>
        </header>

        <!-- 状态栏与今日数据总盘 -->
        <div id="profileBanner" class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center text-xs border-b border-zinc-800/80 pb-2">
                <div>
                    <span class="text-zinc-400">当前模式：</span>
                    <span id="planLabel" class="font-bold text-lime-400">检测中...</span>
                    <span class="text-zinc-500 mx-2">|</span>
                    <span class="text-zinc-400">疲劳指数：</span>
                    <span id="fatigueLabel" class="font-bold text-amber-400">1/5</span>
                </div>
                <span id="nextSurveyTip" class="text-zinc-500">周期：第 1 天</span>
            </div>
            
            <!-- 今日营养看板 -->
            <div class="grid grid-cols-4 gap-2 text-center pt-1">
                <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800/60">
                    <div class="text-[10px] text-zinc-500">今日总热量</div>
                    <div id="totalCalories" class="text-sm font-bold text-lime-400">0 kcal</div>
                </div>
                <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800/60">
                    <div class="text-[10px] text-zinc-500">蛋白质</div>
                    <div id="totalProtein" class="text-sm font-bold text-zinc-200">0 g</div>
                </div>
                <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800/60">
                    <div class="text-[10px] text-zinc-500">碳水化合物</div>
                    <div id="totalCarbs" class="text-sm font-bold text-zinc-200">0 g</div>
                </div>
                <div class="bg-zinc-950 p-2 rounded-lg border border-zinc-800/60">
                    <div class="text-[10px] text-zinc-500">脂肪</div>
                    <div id="totalFat" class="text-sm font-bold text-zinc-200">0 g</div>
                </div>
            </div>
        </div>

        <!-- 主输入区域 -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-4">
            <div class="space-y-2">
                <label class="block text-xs font-medium text-zinc-400">记录饮食 / 全局粘贴截图 (Ctrl+V) / 拍照上传</label>
                <textarea id="userInput" placeholder="页面任意位置按 Ctrl+V 可直接粘贴截图，或直接输入文字描述..." class="w-full h-28 bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none focus:border-zinc-600 transition resize-none"></textarea>
                
                <div id="imagePreviewContainer" class="hidden flex items-center gap-3 bg-zinc-950 p-2 rounded-lg border border-zinc-800">
                    <img id="imagePreview" class="h-16 w-16 object-cover rounded border border-zinc-700" src="" alt="Preview">
                    <div class="flex-1 text-xs text-zinc-400 truncate">
                        <span id="imageName">已挂载图片</span>
                        <p id="imageSubText" class="text-lime-400/80 text-[10px]">已自动本地高质量压缩</p>
                    </div>
                    <button onclick="removeImage()" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1">清除</button>
                </div>
            </div>

            <div class="flex gap-2">
                <label class="flex-1 cursor-pointer bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 text-xs py-2.5 rounded-lg flex items-center justify-center gap-1 transition">
                    <span>📷 手机拍照</span>
                    <input type="file" accept="image/*" capture="environment" onchange="handleFileSelect(event)" class="hidden">
                </label>
                <label class="flex-1 cursor-pointer bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 text-xs py-2.5 rounded-lg flex items-center justify-center gap-1 transition">
                    <span>🖼️ 相册选择</span>
                    <input type="file" accept="image/*" onchange="handleFileSelect(event)" class="hidden">
                </label>
            </div>

            <button onclick="analyze()" class="w-full bg-lime-400 text-zinc-950 font-bold py-3 rounded-lg text-sm hover:bg-lime-300 transition shadow-lg shadow-lime-950/30">
                生成动态调整方案 ↗
            </button>
        </div>

        <!-- 最新分析结果 -->
        <div id="result" class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-sm leading-relaxed min-h-[100px] text-zinc-300 whitespace-pre-wrap">
            等待提交分析...
        </div>

        <!-- 本地历史日志流 -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h2 class="text-xs font-bold text-zinc-300">📅 今日打卡记录日志 (含图片凭证)</h2>
                <button onclick="clearTodayLogs()" class="text-[10px] text-zinc-500 hover:text-rose-400 transition">清空今日数据</button>
            </div>
            <div id="logsContainer" class="space-y-2 text-xs text-zinc-400 max-h-80 overflow-y-auto">
                <p class="text-zinc-600 text-center py-4">暂无打卡记录</p>
            </div>
        </div>
    </div>

    <!-- API Key 设置弹窗 -->
    <div id="keyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-md w-full p-6 space-y-4">
            <h2 class="text-lg font-bold text-zinc-100">🔑 配置 API Key</h2>
            <p class="text-xs text-zinc-400">优先使用此处的 Key，若留空则自动回退至 Vercel 后台环境变量：</p>
            <input id="keyInput" type="password" placeholder="输入火山方舟 API Key..." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 text-xs text-zinc-100 focus:outline-none focus:border-lime-400">
            <div class="flex gap-2">
                <button onclick="saveKey()" class="flex-1 bg-lime-400 text-zinc-950 font-bold py-2 rounded-lg text-xs hover:bg-lime-300 transition">保存配置</button>
                <button onclick="closeKeyModal()" class="bg-zinc-800 text-zinc-300 py-2 px-4 rounded-lg text-xs hover:bg-zinc-700 transition">取消</button>
            </div>
        </div>
    </div>

    <!-- 问卷弹窗 -->
    <div id="surveyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-md w-full p-6 space-y-5">
            <h2 class="text-lg font-bold text-zinc-100 flex items-center justify-between">
                <span>📋 状态与意愿测评</span>
                <span class="text-xs text-zinc-500 font-normal">动态计划适配</span>
            </h2>
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-zinc-300">1. 你近期的身体/精力疲劳度？</label>
                <select id="surveyFatigue" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-200 focus:outline-none">
                    <option value="1">1分 - 精力充沛，状态打满</option>
                    <option value="2">2分 - 状态不错，可以正常自律</option>
                    <option value="3">3分 - 感觉平淡，偶尔想偷懒</option>
                    <option value="4">4分 - 非常疲惫，加班/高压</option>
                    <option value="5">5分 - 处于崩溃边缘，极度想暴饮暴食</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-zinc-300">2. 期望的减脂模式？</label>
                <select id="surveyMode" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-200 focus:outline-none">
                    <option value="strict">严格模式 (高效率缺口，高耐受)</option>
                    <option value="comfortable">舒适减脂模式 (美味与温和缺口兼顾)</option>
                    <option value="relax">心理保护模式 (允许放纵餐，运动清零)</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-zinc-300">3. 阶段性状态反馈：</label>
                <select id="surveyFeeling" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-200 focus:outline-none">
                    <option value="normal">建档评估 / 状态平稳</option>
                    <option value="too_hard">太痛苦了坚持不下去了（自动切入心理保护）</option>
                    <option value="too_easy">毫无压力，可以继续加大力度</option>
                </select>
            </div>
            <div class="pt-2 flex gap-3">
                <button onclick="saveSurvey()" class="flex-1 bg-lime-400 text-zinc-950 font-bold py-2.5 rounded-lg text-xs hover:bg-lime-300 transition">
                    保存并同步生成专属计划
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentBase64Image = '';

        window.addEventListener('DOMContentLoaded', () => {
            checkApiStatus();
            initSurveyState();
            setupGlobalPasteListener();
            renderLogs();
        });

        function checkApiStatus() {
            const key = localStorage.getItem('doubao_key');
            const badge = document.getElementById('apiStatusBadge');
            if (key) {
                badge.className = "text-[10px] px-2 py-0.5 rounded-full bg-lime-950 text-lime-400 border border-lime-800/50 flex items-center gap-1 cursor-pointer";
                badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-lime-400 animate-pulse"></span> 本地 Key 已挂载';
            } else {
                badge.className = "text-[10px] px-2 py-0.5 rounded-full bg-amber-950 text-amber-400 border border-amber-800/50 flex items-center gap-1 cursor-pointer";
                badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> 使用 Vercel 云端配置';
            }
        }

        function openKeyModal() {
            document.getElementById('keyInput').value = localStorage.getItem('doubao_key') || '';
            document.getElementById('keyModal').classList.remove('hidden');
        }

        function closeKeyModal() {
            document.getElementById('keyModal').classList.add('hidden');
        }

        function saveKey() {
            const val = document.getElementById('keyInput').value.trim();
            if (val) {
                localStorage.setItem('doubao_key', val);
            } else {
                localStorage.removeItem('doubao_key');
            }
            checkApiStatus();
            closeKeyModal();
        }

        function setupGlobalPasteListener() {
            document.addEventListener('paste', (e) => {
                const items = (e.clipboardData || (e.originalEvent && e.originalEvent.clipboardData))?.items;
                if (!items) return;
                for (let item of items) {
                    if (item.type && item.type.indexOf('image') === 0) {
                        e.preventDefault();
                        const blob = item.getAsFile();
                        if (blob) processImageFile(blob);
                        break;
                    }
                }
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files && event.target.files[0];
            if (file) {
                processImageFile(file);
                event.target.value = '';
            }
        }

        function processImageFile(file) {
            const nameLabel = document.getElementById('imageName');
            const previewBox = document.getElementById('imagePreviewContainer');
            const previewImg = document.getElementById('imagePreview');

            if (nameLabel) nameLabel.innerText = '处理图片中...';
            if (previewBox) previewBox.classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxDim = 600; // 适当缩小尺寸以适应 localStorage
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
                        else { width = Math.round((width * maxDim) / height); height = maxDim; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentBase64Image = canvas.toDataURL('image/jpeg', 0.4); // 降低体积至 20-30KB
                    if (previewImg) previewImg.src = currentBase64Image;
                    if (nameLabel) nameLabel.innerText = file.name || '粘贴图片';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            currentBase64Image = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function initSurveyState() {
            const profileRaw = localStorage.getItem('user_plan_profile');
            if (!profileRaw) {
                openSurveyModal();
            } else {
                const profile = JSON.parse(profileRaw);
                updateProfileUI(profile, 0);
            }
        }

        function openSurveyModal() {
            document.getElementById('surveyModal').classList.remove('hidden');
        }

        function saveSurvey() {
            const fatigue = parseInt(document.getElementById('surveyFatigue').value);
            let mode = document.getElementById('surveyMode').value;
            const feeling = document.getElementById('surveyFeeling').value;

            if (feeling === 'too_hard') mode = 'relax';

            const profile = { fatigue, mode, feeling, updatedAt: Date.now() };
            localStorage.setItem('user_plan_profile', JSON.stringify(profile));
            document.getElementById('surveyModal').classList.add('hidden');
            updateProfileUI(profile, 0);
        }

        function updateProfileUI(profile, daysPassed) {
            const modeNames = { 'strict': '严格高效 ⚡', 'comfortable': '舒适可持续 🥗', 'relax': '心理保护/放纵 🛡️' };
            document.getElementById('planLabel').innerText = modeNames[profile.mode] || profile.mode;
            document.getElementById('fatigueLabel').innerText = profile.fatigue + '/5';
        }

        function getTodayKey() {
            const d = new Date();
            return `logs_${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`;
        }

        function renderLogs() {
            const logs = JSON.parse(localStorage.getItem(getTodayKey()) || '[]');
            const container = document.getElementById('logsContainer');
            
            let tCal = 0, tPro = 0, tCarb = 0, tFat = 0;

            if (logs.length === 0) {
                container.innerHTML = `<p class="text-zinc-600 text-center py-4">暂无打卡记录</p>`;
            } else {
                container.innerHTML = logs.map((log, index) => {
                    tCal += log.calories || 0;
                    tPro += log.protein || 0;
                    tCarb += log.carbs || 0;
                    tFat += log.fat || 0;

                    return `
                        <div class="bg-zinc-950 p-3 rounded-lg border border-zinc-800/80 flex justify-between items-center gap-3">
                            ${log.image ? `<img src="${log.image}" class="w-14 h-14 object-cover rounded-lg border border-zinc-800 flex-shrink-0" alt="Food">` : ''}
                            <div class="space-y-1 flex-1">
                                <div class="text-zinc-200 font-medium">${log.summary}</div>
                                <div class="text-[10px] text-zinc-500 flex flex-wrap gap-2">
                                    <span class="text-lime-400/90 font-bold">🔥 ${log.calories} kcal</span>
                                    <span>蛋白质: ${log.protein}g</span>
                                    <span>碳水: ${log.carbs}g</span>
                                    <span>脂肪: ${log.fat}g</span>
                                </div>
                            </div>
                            <button onclick="deleteLog(${index})" class="text-zinc-600 hover:text-rose-400 text-xs px-2">✕</button>
                        </div>
                    `;
                }).reverse().join('');
            }

            document.getElementById('totalCalories').innerText = tCal + ' kcal';
            document.getElementById('totalProtein').innerText = tPro + ' g';
            document.getElementById('totalCarbs').innerText = tCarb + ' g';
            document.getElementById('totalFat').innerText = tFat + ' g';
        }

        function deleteLog(index) {
            const key = getTodayKey();
            let logs = JSON.parse(localStorage.getItem(key) || '[]');
            // 反转后的 index 需换算回原数组位置
            const realIndex = logs.length - 1 - index;
            logs.splice(realIndex, 1);
            localStorage.setItem(key, JSON.stringify(logs));
            renderLogs();
        }

        function clearTodayLogs() {
            if (confirm('确定清空今天的所有饮食打卡数据？')) {
                localStorage.removeItem(getTodayKey());
                renderLogs();
            }
        }

        async function analyze() {
            const input = document.getElementById('userInput').value;
            const resBox = document.getElementById('result');
            const apiKey = localStorage.getItem('doubao_key') || '';
            const profile = JSON.parse(localStorage.getItem('user_plan_profile') || '{"fatigue":1,"mode":"comfortable"}');
            
            // 备份当前图片用于保存历史
            const imageToSave = currentBase64Image;

            if (!input.trim() && !imageToSave) {
                return alert('请先输入文字描述或选择/粘贴截图');
            }

            resBox.innerText = 'AI 正在计算计算热量与三大营养素数据...';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        apiKey: apiKey,
                        fatigueScore: profile.fatigue,
                        planMode: profile.mode,
                        imageBase64: imageToSave || null,
                        messages: [{ 
                            role: 'user', 
                            content: `用户状态[模式:${profile.mode}, 疲劳:${profile.fatigue}/5]。评估输入: ${input}\n请严格包含以下JSON数据块供前端解析：\n\`\`\`json\n{"summary":"菜品简述","calories":数值,"protein":数值,"carbs":数值,"fat":数值}\n\`\`\`\n随后给出针对该状态的硬核调整建议。` 
                        }]
                    })
                });

                const rawText = await res.text();
                let data;
                try { data = JSON.parse(rawText); } catch(e) { return resBox.innerText = '后端非 JSON 输出：' + rawText; }

                if (data.error) {
                    resBox.innerText = '❌ 报错拦截：\n' + data.error;
                    if (data.error.includes('API Key')) openKeyModal();
                } else {
                    const reply = data.text || '';
                    resBox.innerText = reply;

                    // 解析 JSON 模块并自动记录日志
                    const jsonMatch = reply.match(/```json\n([\s\S]*?)\n```/) || reply.match(/\{[\s\S]*?\}/);
                    if (jsonMatch) {
                        try {
                            const parsed = JSON.parse(jsonMatch[1] || jsonMatch[0]);
                            if (parsed.calories !== undefined) {
                                // 绑定上传的图片到日志条目中
                                if (imageToSave) {
                                    parsed.image = imageToSave;
                                }
                                const key = getTodayKey();
                                const logs = JSON.parse(localStorage.getItem(key) || '[]');
                                logs.push(parsed);
                                localStorage.setItem(key, JSON.stringify(logs));
                                
                                // 清理输入框与当前预览图片，完成一次打卡
                                document.getElementById('userInput').value = '';
                                removeImage();
                                renderLogs();
                            }
                        } catch(err) { console.log('JSON 解析失败:', err); }
                    }
                }
            } catch (e) {
                resBox.innerText = '请求异常：' + e.message;
            }
        }
    </script>
</body>
</html>
